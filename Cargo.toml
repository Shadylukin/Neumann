[workspace]
resolver = "2"
members = [
    "tensor_store",
    "relational_engine",
    "graph_engine",
    "vector_engine",
    "query_router",
    "neumann_parser",
    "neumann_shell",
    "neumann_client",
    "neumann_server",
    "tensor_compress",
    "tensor_vault",
    "tensor_cache",
    "tensor_blob",
    "integration_tests",
    "tensor_unified",
    "tensor_checkpoint",
    "tensor_chain",
    "stress_tests",
    "examples",
    "tensor_spatial",
]
exclude = ["fuzz", "neumann-py/neumann-native", "experiments", "seed_model", "demos/knowledge-galaxy"]

[workspace.package]
version = "0.4.0"
authors = ["Lukin Ackroyd <lukin@scrunchee.ai>"]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Shadylukin/Neumann"
homepage = "https://scrunchee.ai"
documentation = "https://github.com/Shadylukin/Neumann/tree/main/docs"
keywords = ["database", "tensor", "graph", "vector", "unified"]
categories = ["database", "data-structures"]
rust-version = "1.75"

[workspace.dependencies]
# Async runtime
tokio = { version = "1" }
async-trait = "0.1"
futures = "0.3"
tokio-stream = "0.1"
tokio-test = "0.4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bitcode = { version = "0.6", features = ["serde"] }
prost = "0.14"

# gRPC
tonic = { version = "0.14", features = ["gzip", "tls-ring"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"

# Concurrency
arc-swap = "1"
parking_lot = "0.12"
dashmap = "6"
rayon = "1.10"
crossbeam-channel = "0.5"

# Crypto
sha2 = "0.10"
blake2 = "0.10"
rand = "0.9"
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1", features = ["derive"] }

# Error handling
thiserror = "2"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI / Terminal
clap = { version = "4", features = ["derive"] }

# Storage
memmap2 = "0.9"
tempfile = "3"
crc32fast = "1.4"

# TLS / Certificates
x509-parser = "0.18"
rcgen = "0.13"

# Misc
hex = "0.4"
base64 = "0.22"
libc = "0.2"
bytes = "1"

# Testing
criterion = { version = "0.8", features = ["html_reports"] }

# Internal crates (path + version for crates.io)
tensor_compress = { path = "tensor_compress", version = "=0.4.0" }
neumann_parser = { path = "neumann_parser", version = "=0.4.0" }
tensor_spatial = { path = "tensor_spatial", version = "=0.4.0" }
tensor_store = { path = "tensor_store", version = "=0.4.0" }
relational_engine = { path = "relational_engine", version = "=0.4.0" }
graph_engine = { path = "graph_engine", version = "=0.4.0" }
vector_engine = { path = "vector_engine", version = "=0.4.0" }
tensor_vault = { path = "tensor_vault", version = "=0.4.0" }
tensor_cache = { path = "tensor_cache", version = "=0.4.0" }
tensor_blob = { path = "tensor_blob", version = "=0.4.0" }
tensor_chain = { path = "tensor_chain", version = "=0.4.0" }
tensor_checkpoint = { path = "tensor_checkpoint", version = "=0.4.0" }
tensor_unified = { path = "tensor_unified", version = "=0.4.0" }
query_router = { path = "query_router", version = "=0.4.0" }
neumann_client = { path = "neumann_client", version = "=0.4.0" }
neumann_server = { path = "neumann_server", version = "=0.4.0" }
neumann-db = { path = "neumann_shell", version = "=0.4.0" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
