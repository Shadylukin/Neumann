[package]
name = "integration_tests"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
description = "Cross-crate integration tests for Neumann"

[dependencies]
tensor_store.workspace = true
tensor_compress.workspace = true
relational_engine = { workspace = true, features = ["test-internals"] }
graph_engine.workspace = true
vector_engine.workspace = true
tensor_vault.workspace = true
tensor_cache.workspace = true
tensor_blob = { workspace = true, features = ["full"] }
tensor_checkpoint.workspace = true
tensor_unified.workspace = true
tensor_chain.workspace = true
query_router.workspace = true
neumann_parser.workspace = true
neumann-db.workspace = true
neumann_client = { workspace = true, features = ["full"] }
neumann_server.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
futures.workspace = true
serde_json.workspace = true
parking_lot.workspace = true
rand.workspace = true
rand_chacha = "0.9"
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
bitcode.workspace = true
sha2.workspace = true
crc32fast.workspace = true

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
