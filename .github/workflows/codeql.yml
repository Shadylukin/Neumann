---
name: CodeQL

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 0'  # Weekly on Sunday at 3am UTC

permissions:
  security-events: write
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript', 'python']

    steps:
      - name: Checkout
        # v4.2.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Initialize CodeQL
        # v3.28.18
        uses: >-
          github/codeql-action/init@89a39a4e59826350b863aa6b6252a07ad50cf83e
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality
          config: |
            paths-ignore:
              - '**/node_modules'
              - '**/coverage'
              - 'neumann-ts/coverage'
              - 'docs/book-output'
              - '**/.venv'
              - '**/*_pb2.py'
              - '**/*_pb2_grpc.py'

      - name: Setup Node.js
        if: matrix.language == 'javascript-typescript'
        # v4.1.0
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: '20'

      - name: Build TypeScript
        if: matrix.language == 'javascript-typescript'
        working-directory: neumann-ts
        run: |
          npm ci
          npm run build

      - name: Setup Python
        if: matrix.language == 'python'
        # v5.6.0
        uses: >-
          actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        if: matrix.language == 'python'
        working-directory: neumann-py
        run: |
          pip install -e ".[dev]"

      - name: Perform CodeQL Analysis
        # v3.28.18
        uses: >-
          github/codeql-action/analyze@89a39a4e59826350b863aa6b6252a07ad50cf83e
        with:
          category: "/language:${{ matrix.language }}"
